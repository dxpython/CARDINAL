[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardinal-repro"
version = "0.1.0"
description = "Reproducible implementation of CARDINAL: physiology-guided directional structure and prototype learning for small-sample echocardiographic assessment"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "networkx>=3.0",
]

[project.optional-dependencies]
baselines = [
  "xgboost>=1.7",
  "pytorch-tabnet>=4.0",
  "pytorch-tabular>=1.1",
  "tabpfn>=2.0",
]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
